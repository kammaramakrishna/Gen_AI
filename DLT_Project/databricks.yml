# This is a Databricks asset bundle definition for DLT_Project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DLT_Project
  uuid: 550a5b3a-cdea-46fa-8369-4c70f72e83d7

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9b1af8b2-d0ce.cloud.databricks.com
    variables:
      catalog: dlt
      schema: bronze
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-9b1af8b2-d0ce.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/kammaramakrishna12@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/kammaramakrishna12@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dlt_prod
      schema: bronze
    permissions:
      - user_name: kammaramakrishna12@gmail.com
        level: CAN_MANAGE
